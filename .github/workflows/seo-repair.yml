name: Repair site SEO and UX from sitemap

on:
  push:
    paths:
      - scripts/seo-repair.mjs
      - .github/workflows/seo-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply and validate 98-page SEO and UX repairs
        run: node scripts/seo-repair.mjs
      - name: Commit repaired pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if ! git diff --cached --quiet; then
            git commit -m "Repair missing social metadata, footers, schema and navigation"
            git push
          else
            echo "No HTML changes needed"
          fi
